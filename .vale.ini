# Extends the umbrella house style (198x/.vale.ini) for this site.
#
# The site's pages are .astro, and vale does not know that extension: running
# `vale src/pages/foo.astro` reported "0 errors ... in 0 files" and exited 0.
# It scanned nothing and called it success, which is the failure mode this
# repository's gates exist to remove.
#
# The gate therefore runs over the BUILT HTML rather than the source. That is
# the prose a reader actually gets, and it excludes the Astro frontmatter —
# which is JavaScript, and whose comments are a contributor surface where
# naming a decision record is correct rather than an "inside voice" leak.
#
# Run it with `npm run prose`, never bare `vale`: the wrapper fails when no
# file was scanned, which bare vale reports as a pass.
#
# Setup (once, and after a house-style release):  vale sync
StylesPath = ../../.vale
Vocab = 198x
MinAlertLevel = suggestion

[formats]
mdx = md
astro = html

[*.{md,mdx}]
BasedOnStyles = House198x
# Passive voice is the noisiest rule and often correct in technical prose.
House198x.Passive = NO

[*.html]
BasedOnStyles = House198x
House198x.Passive = NO
