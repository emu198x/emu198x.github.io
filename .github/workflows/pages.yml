name: Pages

# Builds the site and deploys it to GitHub Pages with the workflow every 198x
# site shares (stevehill1981/198x-workflows). Pull requests build and check
# without deploying.
#
# The build fetches what it needs itself: scripts/fetch-emu198x.mjs takes the
# flagship's docs and changelog from Emu198x main, and the player is the
# pinned @emu198x/player package, so nothing here checks out Emu198x or
# compiles Rust. The daily run picks up documentation changes on main.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Pages
    uses: stevehill1981/198x-workflows/.github/workflows/pages-astro.yml@v1
    with:
      # Vale is the house prose style, which the build's prose check needs.
      check-command: |
        curl -fsSL "https://github.com/errata-ai/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz" \
          | sudo tar -xz -C /usr/local/bin vale
        vale --version
        vale sync
        npm test
      browser-check-command: npm run a11y
