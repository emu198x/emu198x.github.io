name: Pages

on:
  push:
    branches:
      - main
  # The registry and the evidence table live in emu198x/emu198x, so a change
  # there can break this build with nothing here to fire it. Daily and not
  # weekly: a week is a long time for a broken fleet list to sit on a public
  # site, and the contract check is what turns the break into a failure.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Check out Emu198x source docs
        uses: actions/checkout@v7
        with:
          repository: emu198x/emu198x
          path: emu198x-source

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          EMU198X_SOURCE_ROOT: ${{ github.workspace }}/emu198x-source

      # Between building and publishing, because a page that fails WCAG AA is
      # not one to deploy. Every route, both themes — roughly half the defects
      # this caught when it was first run existed in exactly one of them.
      - name: Install the browser the sweep drives
        run: npx playwright install --with-deps chromium

      - name: Check accessibility
        run: npm run a11y

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
